<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anka Sadakat</title>
<meta name="description" content="Anka İletişim Sadakat Programı: puan bakiyeniz, damga kartınız ve kasa kodunuz.">
<meta name="theme-color" content="#C20C77">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23C20C77' d='m12 2.5 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pinktx:#C20C77;--bg:#F4F7FA;--card:#fff;--fg:#14212B;--muted:#5D6B78;--line:#DDE5EC;--pink:#C20C77;--pink2:#E2579F;--pinkbg:#FCEAF4;--ok:#1A8F4E;--okbg:#E6F5EC;--warn:#A86400;--warnbg:#FFF4DF;--bad:#C0362C;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--sh:0 1px 2px rgba(20,33,43,.06),0 6px 20px rgba(20,33,43,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F171D;--card:#17222A;--fg:#E7EEF3;--muted:#98A7B3;--line:#28363F;--pinkbg:#3A1430;--okbg:#12301F;--warnbg:#3A2A10;--sh:none;--pinktx:#FF7AC2;--ok:#5ECB92;--warn:#E8B04A;--bad:#FF8A80}}
:root[data-theme="dark"]{--bg:#0F171D;--card:#17222A;--fg:#E7EEF3;--muted:#98A7B3;--line:#28363F;--pinkbg:#3A1430;--okbg:#12301F;--warnbg:#3A2A10;--sh:none;--pinktx:#FF7AC2;--ok:#5ECB92;--warn:#E8B04A;--bad:#FF8A80}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;min-height:100dvh}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
header .lg{height:30px;width:auto;display:block}.lg-d{display:none!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-l{display:none!important}:root:not([data-theme="light"]) .lg-d{display:block!important}}
header .t{margin-left:auto;font-weight:600;color:var(--pinktx);font-size:14px;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13.5px}.mono{font-family:var(--mono)}
label{display:block;font-weight:600;font-size:13.5px;margin:12px 0 6px}
.in{width:100%;font:inherit;font-size:18px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);outline:none}
.in:focus{border-color:var(--pinktx);box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 18%,transparent)}
.in.code{font-family:var(--mono);letter-spacing:.5em;text-align:center;font-size:26px;padding-left:calc(14px + .25em)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:inherit;font-weight:600;font-size:16px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;margin-top:12px;text-decoration:none}
.btn.pri{background:var(--pink);border-color:var(--pinktx);color:#fff}.btn:disabled{opacity:.55;cursor:default}
.btn.lnk{border:0;background:none;color:var(--pinktx);padding:8px;margin-top:4px;font-size:14.5px;width:auto;display:inline-flex}
.err{color:var(--bad);font-size:14px;margin-top:10px;font-weight:500}.err:empty{display:none}
.ok{color:var(--ok)}.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.bal{background:linear-gradient(135deg,var(--pink),#8E0A58);color:#fff;border:0;position:relative;overflow:hidden}
.bal .k{font-size:13.5px;opacity:.9}.bal .v{font-size:44px;font-weight:700;line-height:1.05;letter-spacing:-.02em;margin:4px 0}.bal .e{font-size:14px;opacity:.92}
.bal::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.bal .pend{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22);font-size:13.5px}
.kasa{border:2px solid var(--pink);background:var(--pinkbg)}
.kasa .code{font-family:var(--mono);font-size:46px;font-weight:600;letter-spacing:.18em;text-align:center;color:var(--pinktx);margin:8px 0 4px}
.bar{height:6px;border-radius:6px;background:color-mix(in srgb,var(--pink) 18%,transparent);overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--pink);transition:width 1s linear}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:6px 0 8px}
.dot{aspect-ratio:1;border-radius:50%;border:2px dashed color-mix(in srgb,var(--pink) 45%,var(--line));display:grid;place-items:center;font-weight:600;color:var(--muted);font-size:14px}
.dot.on{background:var(--pink);border:2px solid var(--pink);color:#fff}.dot.rw{border-color:#E2A33B;border-style:solid}.dot.rw.on{background:#E2A33B;border-color:#E2A33B}
.dot{display:flex;align-items:center;justify-content:center}.dot svg.ic{width:22px;height:22px;margin:0;display:block}
.rw{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.rw:first-of-type{border-top:0}
.wr{padding:12px 0;border-top:1px solid var(--line)}.wr:first-of-type{border-top:0;padding-top:4px}.wr .left{font-size:30px;font-weight:700;color:var(--pinktx);line-height:1}.wr .parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.wr .pt{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--pinkbg);color:var(--fg)}.wr .pt.off{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--okbg);color:var(--ok)}.pill.w{background:var(--warnbg);color:var(--warn)}
.hist{list-style:none;margin:0;padding:0}.hist li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.hist li:first-child{border-top:0}
.hist .p{margin-left:auto;font-weight:600;white-space:nowrap}.pos{color:var(--ok)}.neg{color:var(--bad)}
.rules li{margin:5px 0}.rules{padding-left:18px;margin:6px 0}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.sv-demo{margin:0 0 14px;background:var(--pinkbg);color:var(--pinktx)}.sv-demo b{color:inherit}
.ic{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}footer a{color:inherit}
.sv-st{font-size:34px;line-height:1;background:none;border:0;color:var(--line);cursor:pointer;padding:2px 3px}.sv-st.on{color:#E2A33B}
.sv-nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}.sv-n{font:inherit;font-weight:600;padding:10px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer}.sv-n.on{background:var(--pink);border-color:var(--pinktx);color:#fff}
.pv-sw{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:10px 0;cursor:pointer}.pv-sw input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--pink);flex:none}.pv-sw b{display:block;font-size:14.5px}.pv-sw .sub{display:block}
.hidden{display:none!important}.center{text-align:center}
.spin{width:22px;height:22px;border:3px solid color-mix(in srgb,var(--pink) 25%,transparent);border-top-color:var(--pinktx);border-radius:50%;animation:sp 0.8s linear infinite;margin:30px auto}@keyframes sp{to{transform:rotate(360deg)}}
.fs-l{list-style:none;margin:8px 0 0;padding:0}.fs-l li{border-top:1px solid var(--line)}.fs-l li:first-child{border-top:0}
.fs-i{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:11px 0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.fs-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fs-v{font-weight:700;white-space:nowrap}.fs-a{color:var(--muted);margin-left:6px;font-weight:400}
.fs-bar{margin:-4px 0 6px}.rc-h{margin:14px 0 6px;padding:10px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.rc-kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}.rc-kv span{color:var(--muted)}.rc-kv.big{font-size:19px;border-top:2px solid var(--fg);margin-top:6px;padding-top:8px}.rc-kv.big span{color:var(--fg);font-weight:700}
.rc-kv.save{background:var(--pinkbg);border-radius:8px;padding:6px 10px;margin:4px 0}.rc-kv.save span,.rc-kv.save b{color:var(--pinktx)}.rc-kv.pos b{color:var(--ok)}.rc-kv.neg b{color:var(--bad)}
.rc-ln{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.rc-ln:first-child{border-top:0}.rc-ln.ret b{text-decoration:line-through;color:var(--muted)}.rc-amt{white-space:nowrap}
.rc-tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}.rc-sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 4px}
.lnk2{color:var(--pinktx);font-weight:600;white-space:nowrap}
@media print{:root,:root[data-theme="dark"]{--fg:#111!important;--muted:#555!important;--card:#fff!important;--line:#ddd!important;--bg:#fff!important;--pinktx:#C20C77!important;--pinkbg:#FCEAF4!important}header,footer,.fs-bar{display:none!important}body{background:#fff}.card.rc{border:0;box-shadow:none;padding:0}.wrap{max-width:none}}
</style>
</head>

  iade_geri:['İade: kazanılan puan geri alındı','neg'],iade_mahsup:['İade tutarından düşüldü',''],duzeltme:['Düzeltme',''],sure_doldu:['Süresi dolan puan','neg'],damga:['Damga kazanıldı',''],damga_geri:['İade: damga geri alındı','neg'],odul:['Damga ödülü kullanıldı',''],anket:['Memnuniyet anketi teşekkür puanı','pos']};
const S={step:'tel',phone:store.get(PK)||'',tok:store.get(TK),d:null,kasa:null,err:'',busy:false,cd:0};

async function api(action,body){
  let r;try{r=await fetch(API,{method:'POST',headers:{'content-type':'application/json',apikey:KEY,authorization:'Bearer '+KEY},body:JSON.stringify({action,...body})})}
  catch(e){throw new Error('Bağlantı kurulamadı. İnternetinizi kontrol edip tekrar deneyin.')}
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&action.startsWith('portal_')&&action!=='portal_giris'){logout(true);S.err=j.error||'Oturum süresi doldu, yeniden giriş yapın';throw new Error(S.err)}
  if(!r.ok)throw new Error(j.error||'İşlem yapılamadı ('+r.status+')');return j}

function render(){
  if(S.step==='tel')return vTel();if(S.step==='kod')return vKod();if(!S.d){app.innerHTML='<div class="spin"></div>';return}if(FS.rc)return vFis();return vHome()}

function vTel(){app.innerHTML=`<div class="card"><h1>Hoş geldiniz</h1><p class="sub">Puan bakiyenizi, damga kartınızı görmek ve kasada puan kullanmak için mağazada üye olduğunuz cep numarasını yazın. Doğrulama kodu <b>SMS</b> ile gelir.</p>
  <label for="tel">Cep telefonu</label><input class="in" id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="05XX XXX XX XX" value="${esc(S.phone?phoneTxt(S.phone):'')}">
  <button class="btn pri" id="send" ${S.busy?'disabled':''}>${ic('sms')} ${S.busy?'Gönderiliyor…':'SMS ile kod gönder'}</button><div class="err" id="err">${esc(S.err)}</div></div>
  <div class="card"><h2>Üye değil misiniz?</h2><p class="sub" style="margin:0">Üyelik mağazamızda, alışveriş sırasında ücretsiz yapılır. İlk alışverişinizde hoş geldin puanı kazanırsınız.</p></div>`;
  const t=$('tel');t.addEventListener('keydown',e=>{if(e.key==='Enter')sendCode()});$('send').onclick=sendCode;if(!S.phone)t.focus()}

function vKod(){app.innerHTML=`<div class="card"><h1>Kodu girin</h1><p class="sub"><b>${esc(phoneTxt(S.phone))}</b> numarası mağazamızda üyeyse SMS ile 6 haneli bir kod gönderdik.</p>
  <label for="code">Doğrulama kodu</label><input class="in code" id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
  <button class="btn pri" id="login" ${S.busy?'disabled':''}>${S.busy?'Kontrol ediliyor…':'Giriş yap'}</button><div class="err" id="err">${esc(S.err)}</div>
  <div class="row" style="margin-top:6px"><button class="btn lnk" id="again" ${S.cd>0?'disabled':''}>${S.cd>0?`Yeniden gönder (${S.cd} sn)`:'Kodu yeniden gönder'}</button><span class="sp"></span><button class="btn lnk" id="chg">Numarayı değiştir</button></div>
  <p class="sub" style="margin-bottom:0">Kod 1 dakika içinde gelmediyse numaranın üyelikteki numara olduğunu kontrol edip yeniden isteyin. Kodu kimseyle paylaşmayın.</p></div>`;
  const c=$('code');c.addEventListener('input',()=>{c.value=c.value.replace(/\D/g,'').slice(0,6);if(c.value.length===6)login()});c.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
  $('login').onclick=login;$('again').onclick=sendCode;$('chg').onclick=()=>{S.step='tel';S.err='';render()};c.focus()}

let cdT=null;
function startCd(){S.cd=60;clearInterval(cdT);cdT=setInterval(()=>{S.cd--;const a=$('again');if(a){a.disabled=S.cd>0;a.textContent=S.cd>0?`Yeniden gönder (${S.cd} sn)`:'Kodu yeniden gönder'}if(S.cd<=0)clearInterval(cdT)},1000)}

async function sendCode(){const el=$('tel'),p=el?phoneOk(el.value):S.phone;if(!p){S.err='Geçerli bir cep telefonu yazın (05XX XXX XX XX).';return render()}
  S.phone=p;store.set(PK,p);S.err='';S.busy=true;render();
  try{await api('portal_kod',{phone:p});S.step='kod';startCd()}catch(e){S.err=e.message}S.busy=false;render()}

async function login(){const c=$('code').value.replace(/\D/g,'');if(c.length!==6){S.err='6 haneli kodu yazın.';return render()}if(S.busy)return;
  S.err='';S.busy=true;render();
  try{const r=await api('portal_giris',{phone:S.phone,code:c});S.tok=r.token;store.set(TK,r.token);S.step='home';S.busy=false;await load()}catch(e){S.err=e.message;S.busy=false;render()}}

async function load(){if(!S.tok){S.step='tel';return render()}S.step='home';render();
  try{S.d=await api('portal_bilgi',{token:S.tok});S.err=''}catch(e){if(S.step==='home'){S.err=e.message;S.d=S.d||{err:true}}}render();
  if(S.d&&!S.d.err)fsLoad()}

function logout(silent){if(!silent&&S.tok)api('portal_cikis',{token:S.tok}).catch(()=>{});S.tok=null;store.set(TK,null);S.d=null;S.kasa=null;FS.list=null;FS.rc=null;clearInterval(kT);S.step='tel';S.err='';if(!silent)render()}

let kT=null;
async function getKasa(btn){btn.disabled=true;try{S.kasa=await api('portal_kasa',{token:S.tok});S.kasa.until=Date.now()+S.kasa.ttl*60000;tickKasa()}catch(e){alertBox(e.message)}btn.disabled=false;render()}
function tickKasa(){clearInterval(kT);kT=setInterval(()=>{if(!S.kasa){clearInterval(kT);return}const left=S.kasa.until-Date.now();if(left<=0){S.kasa=null;clearInterval(kT);render();return}
  const b=$('kbar'),t=$('kleft');if(b)b.style.width=(left/(S.kasa.ttl*60000)*100)+'%';if(t)t.textContent=fmtLeft(left)},1000)}
const fmtLeft=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function alertBox(m){S.err=m;render()}

function wrCard(L){if(!Array.isArray(L)||!L.length)return '';

const FS={list:null,busy:false,err:'',rc:null,rcBusy:false,y:0};

async function fsLoad(more){if(FS.busy)return;FS.busy=true;FS.err='';if(more)render();
  try{const L=FS.list,before=more&&L&&L.items.length?L.items[L.items.length-1].at:undefined;
    const r=await api('portal_fisler',{token:S.tok,limit:more?10:5,...(before?{before}:{})});

  catch(e){if(!more)FS.list=null;else FS.err=e.message}   // eski sunucu fonksiyonunda kart hiç görünmez

function fsCard(){const L=FS.list;if(!L||!Array.isArray(L.items))return '';

function fsBind(){document.querySelectorAll('[data-fis]').forEach(b=>b.onclick=()=>fsOpen(b.dataset.fis));const m=$('fs-more');if(m)m.onclick=()=>fsLoad(true)}
async function fsOpen(id){if(FS.rcBusy)return;FS.rcBusy=true;FS.y=window.scrollY;FS.rc={loading:true};render();window.scrollTo(0,0);
  try{FS.rc=await api('portal_fis',{token:S.tok,id})}catch(e){FS.rc={error:e.message}}FS.rcBusy=false;if(FS.rc)render()}
function fsClose(){FS.rc=null;render();window.scrollTo(0,FS.y||0)}

    <div class="sub">${[sh.phone,sh.email].filter(Boolean).map(esc).join(' · ')}</div>${sh.tax_no?`<div class="sub">${esc([sh.tax_office,sh.tax_no?'VKN '+sh.tax_no:''].filter(Boolean).join(' · '))}</div>`:''}</div>
   <div class="rc-h"><div>${kv('Fiş no','<span class="mono">'+esc(d.sale_no)+'</span>')}${kv('Tarih',esc(dtt(d.sold_at)))}${d.staff?kv('Satışı yapan',esc(d.staff)):''}</div></div>

    ${(d.trades||[]).map(t=>kv('Takas: '+esc(t.name),'−'+money(t.value))).join('')}${kv('TOPLAM',money(d.total),'big')}</div>

   ${Number(d.returns)>0?kv('İade edilen tutar',money(d.returns),'neg'):''}
   ${ly&&(ly.earned||ly.spent||ly.stamp)?`<div class="rc-sec">Sadakat</div>${ly.spent?kv('Kullanılan puan','−'+num(ly.spent)):''}${ly.earned?kv('Kazanılan puan','+'+num(ly.earned),'pos'):''}${ly.stamp?kv('Damga','+1'):''}${ly.earned?`<div class="sub">Puanlar alışverişten ${num(ly.wait_days)} gün sonra kullanılabilir.</div>`:''}`:''}
   ${(d.warranties||[]).length?`<div class="rc-sec">Garanti belgesi</div>${d.warranties.map(w=>`<div class="rc-kv"><span>${esc(w.model)} · ${esc(w.cert_no)}<div class="sub">${num(w.months)} ay · ${dt(w.end_date)} tarihine kadar</div></span>${w.url?`<a class="lnk2" href="${esc(w.url)}" target="_blank" rel="noopener">Belgeyi aç</a>`:''}</div>`).join('')}`:''}
   ${d.receipt_note?`<p class="sub center" style="margin-top:14px">${esc(d.receipt_note)}</p>`:''}

function pvBind(){const mk=$('pv-mk'),em=$('pv-em');

    try{const r=await api('portal_izin',{token:S.tok,[k]:v});S.d.privacy={...S.d.privacy,...r};PV.msg=k==='marketing'?(v?'Kampanya mesajları açıldı.':'Kampanya mesajları kapatıldı.'):(v?'E-posta bildirimleri açıldı.':'E-posta bildirimleri kapatıldı.')}

  const x=$('pv-x');if(x)x.onclick=()=>{PV.del=false;PV.err='';render()};
  const g=$('pv-go');if(g)g.onclick=async()=>{if(!$('pv-ok').checked){PV.err='Devam etmek için onay kutusunu işaretleyin.';return render()}
    PV.busy=true;PV.err='';const note=$('pv-note').value;render();
    try{const r=await api('portal_kvkk',{token:S.tok,note});PV.del=false;PV.msg=`Başvurunuz alındı (${r.no}). En geç ${dt(r.due_on)} tarihine kadar sonuçlandırılacak.`;
      const rq=(S.d.privacy.requests||[]).filter(q=>q.no!==r.no);S.d.privacy.requests=[{no:r.no,kind:'silme',status:'yeni',received_on:new Date().toISOString().slice(0,10),due_on:r.due_on},...rq]}
    catch(e){PV.err=e.message}PV.busy=false;render()}}
function rwTxt(r){return r.type==='yuzde'?`seçili üründe %${num(r.value)} indirim`:r.type==='hediye'?'seçili ürün hediye':`${money(r.value)} indirim`}
function stampRule(R){const m=money(R.stamp_min);return {ikisi:`${m} ve üzeri, seçili ürün içeren her alışverişte 1 damga`,biri:`${m} ve üzeri ya da seçili ürün içeren her alışverişte 1 damga`,tutar:`${m} ve üzeri her alışverişte 1 damga`,urun:'Seçili ürün içeren her alışverişte 1 damga'}[R.stamp_rule]||''}

function vHome(){const d=S.d;if(d.err&&!d.name){app.innerHTML=`<div class="card"><p class="err">${esc(S.err)}</p><button class="btn pri" id="re">${ic('ref')} Tekrar dene</button><button class="btn" id="lo">Çıkış</button></div>`;$('re').onclick=load;$('lo').onclick=()=>logout();return}
  const R=d.rules||{},first=String(d.name||'').trim().split(/\s+/)[0]||'';
  const pend=(d.pending_list||[]).map(p=>`<div>${dts(p.at)}: <b>+${num(p.points)} puan</b> kullanılabilir olacak</div>`).join('');
  const exp=(d.expiring||[]).map(p=>`<div class="note">${ic('clock')} ${num(p.points)} puanın süresi ${dt(p.at)} tarihinde doluyor.</div>`).join('');
  const rwAt=new Map((R.stamp_rewards||[]).map(x=>[Number(x.at),x]));
  const dots=d.stamp_on?Array.from({length:d.size||10},(_,k)=>{const n=k+1,rw=rwAt.get(n);return `<div class="dot${n<=d.stamps?' on':''}${rw?' rw':''}" title="${n}. damga${rw?': '+esc(rwTxt(rw)):''}">${rw?ic('gift'):n}</div>`}).join(''):'';
  const k=S.kasa;
  app.innerHTML=`${d.status!=='aktif'?'<div class="note">Üyeliğiniz şu an askıda. Ayrıntı için mağazamıza danışın.</div>':''}${d.on===false?'<div class="note">Sadakat programı şu an durduruldu; puanlarınız korunuyor.</div>':''}
  <div class="row" style="margin:2px 2px 10px"><div><div class="sub">Merhaba</div><h1 style="margin:0">${esc(first)}</h1></div><span class="sp"></span><button class="btn lnk" id="ref" aria-label="Yenile">${ic('ref')}</button></div>
  <div class="card bal"><div class="k">Kullanılabilir puan</div><div class="v">${num(d.avail)}</div><div class="e">= ${money(d.avail)} indirim · 1 puan = 1 ₺</div>
   ${d.pending?`<div class="pend">${num(d.pending)} puan bekleme süresinde${pend?`<div style="margin-top:4px">${pend}</div>`:''}</div>`:''}${d.debt?`<div class="pend">${num(d.debt)} puan iade borcu sonraki kazanımınızdan düşülecek.</div>`:''}</div>
  ${exp}
  <div class="card kasa">${k?`<div class="center"><div class="sub">Kasiyere bu kodu söyleyin</div><div class="code mono" id="kcode">${esc(k.code)}</div>
     <div class="bar"><i id="kbar" style="width:100%"></i></div><div class="sub"><span id="kleft">${fmtLeft(k.until-Date.now())}</span> içinde, tek seferlik kullanılabilir.</div></div>
     <button class="btn" id="knew">Yeni kod al</button>`
   :`<h2 class="row">${ic('key')} Kasada puan kullanın</h2><p class="sub" style="margin:0">Ödeme sırasında puan ya da ödül kullanmak için kasa kodu alın ve kasiyere söyleyin. Kod ${num(R.kasa_ttl||10)} dakika geçerlidir.</p>
     <button class="btn pri" id="kget" ${d.status!=='aktif'?'disabled':''}>${ic('key')} Kasa kodu al</button>`}</div>
  ${d.stamp_on?`<div class="card"><div class="row"><h2 style="margin:0">Damga kartı</h2><span class="sp"></span><span class="sub">${num(d.stamps)}/${num(d.size)}${d.cards_done?` · ${num(d.cards_done)} kart tamamlandı`:''}</span></div>
    <div class="stamps" style="margin-top:12px">${dots}</div><div class="sub">${esc(stampRule(R))}.</div>
    ${(R.stamp_rewards||[]).length?`<div class="sub" style="margin-top:4px">${R.stamp_rewards.map(x=>`${num(x.at)}. damga: ${esc(rwTxt(x))}`).join(' · ')}</div>`:''}</div>`:''}
  ${(d.rewards||[]).length?`<div class="card"><h2>Ödülleriniz</h2>${d.rewards.map(r=>`<div class="rw">${ic('gift')}<div><b>${num(r.at)}. damga ödülü</b> · ${esc(rwTxt(r))}<div class="sub">${r.ready?'<span class="pill">Kullanılabilir</span> Kasada kasa koduyla kullanın.':`<span class="pill w">${dts(r.avail_at)} tarihinden sonra</span>`}</div></div></div>`).join('')}</div>`:''}
  ${wrCard(d.warranties)}
  ${fsCard()}
  <div class="card"><h2>Nasıl kazanırım?</h2><ul class="rules">
    ${R.mode==='sabit'?`<li>Her ${money(R.fix_amount)} alışverişe ${num(R.fix_points)} puan</li>`:`<li>Cihaz alışverişlerinde <b>%${num(R.pct_dev)}</b>, aksesuarda <b>%${num(R.pct_acc)}</b>, hizmetlerde <b>%${num(R.pct_svc)}</b> puan</li>`}
    <li>Puanlar alışverişten ${num(R.wait_days)} gün sonra kullanılabilir</li>
    <li>Bir alışverişte en az ${num(R.min_use)} puan, tutarın en çok %${num(R.max_use_pct)}'i puanla ödenebilir</li>
    ${Number(R.expiry_months)?`<li>Puanlar ${num(R.expiry_months)} ay geçerlidir</li>`:'<li>Puanların süresi dolmaz</li>'}
    ${Number(R.birthday)?`<li>Doğum gününüzde ${num(R.birthday)} puan hediye${d.birthday?'':' (doğum tarihinizi mağazada kaydettirin)'}</li>`:''}
    <li>Ürün iade edilirse o alışverişten kazanılan puan geri alınır</li></ul></div>
  <div class="card"><h2>Son hareketler</h2>${(d.history||[]).length?`<ul class="hist">${d.history.map(h=>{const K=KIND[h.kind]||[h.kind,''];const v=h.points?`${h.points>0?'+':''}${num(h.points)} puan`:h.stamps?`${h.stamps>0?'+':''}${num(h.stamps)} damga`:'';
      return `<li><div><div>${esc(K[0])}</div><div class="sub">${dt(h.at)}</div></div><span class="p ${h.points>0||h.stamps>0?'pos':h.points<0||h.stamps<0?'neg':''}">${v}</span></li>`}).join('')}</ul>`:'<p class="sub">Henüz hareket yok.</p>'}</div>
  ${pvCard(d.privacy)}
  <div class="card"><div class="row"><div><b>${esc(d.shop&&d.shop.name||'Anka İletişim')}</b>${d.shop&&d.shop.phone?`<div class="sub">${esc(d.shop.phone)}</div>`:''}</div><span class="sp"></span>
    ${d.shop&&d.shop.phone?`<a class="btn" style="width:auto;margin:0;padding:10px 14px" href="tel:${esc(String(d.shop.phone).replace(/[^\d+]/g,''))}">Ara</a>`:''}</div>
    ${d.shop&&d.shop.address?`<div class="sub" style="margin-top:6px">${esc(d.shop.address)}</div>`:''}${d.shop&&d.shop.hours?`<div class="sub" style="margin-top:4px">${ic('clock')} ${esc(d.shop.hours)}</div>`:''}
    ${d.shop&&(d.shop.web||d.shop.instagram)?`<div class="sub" style="margin-top:4px">${d.shop.web?`<a href="${esc(d.shop.web)}" target="_blank" rel="noopener" style="color:var(--pinktx)">${esc(String(d.shop.web).replace(/^https?:\/\//,'').replace(/\/$/,''))}</a>`:''}${d.shop.web&&d.shop.instagram?' · ':''}${d.shop.instagram?`<a href="https://instagram.com/${esc(String(d.shop.instagram).replace(/^@/,''))}" target="_blank" rel="noopener" style="color:var(--pinktx)">Instagram ${esc(d.shop.instagram)}</a>`:''}</div>`:''}</div>
  <div class="err center">${esc(S.err)}</div>
  <div class="center"><span class="sub">${esc(d.phone)} · üyelik ${dt(d.joined_at)}</span><br><button class="btn lnk" id="lo">${ic('out')} Çıkış yap</button></div>`;
  $('ref').onclick=load;$('lo').onclick=()=>logout();pvBind();fsBind();const g=$('kget')||$('knew');if(g)g.onclick=()=>getKasa(g);if(k)tickKasa()}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.step==='home'&&S.tok&&!S.kasa)load()});
// 093: e-postadaki "bildirimlerden çık" bağlantısı (#eposta-ret=<anahtar>)
function vRet(tok){app.innerHTML=`<div class="card"><h1>E-posta bildirimleri</h1><p class="sub">Anka İletişim'in satış fişi, sadakat programı ve servis bilgilendirme e-postalarını artık almak istemiyorsanız aşağıdaki düğmeye basın.</p>
  <button class="btn pri" id="ret">E-posta bildirimlerinden çık</button><div class="err" id="err"></div></div>
  <div class="card"><p class="sub" style="margin:0">Sadakat üyeliğiniz ve puanlarınız bundan etkilenmez. Fikrinizi değiştirirseniz mağazamızdan yeniden açtırabilirsiniz.</p></div>`;
  $('ret').onclick=async()=>{const b=$('ret');b.disabled=true;b.textContent='İşleniyor…';
    try{let r,j={};try{r=await fetch(API.replace(/\/sadakat$/,'/eposta'),{method:'POST',headers:{'content-type':'application/json',apikey:KEY,authorization:'Bearer '+KEY},body:JSON.stringify({action:'ret',token:tok})});j=await r.json()}catch(e){throw new Error('Bağlantı kurulamadı. İnternetinizi kontrol edip tekrar deneyin.')}
      if(!r.ok||!j.ok)throw new Error(j.error||'İşlem yapılamadı');
      app.innerHTML=`<div class="card"><h1 class="ok">Bildirimlerden çıktınız</h1><p class="sub"><b>${esc(j.email||'')}</b> adresine artık otomatik bilgilendirme e-postası gönderilmeyecek.</p></div>`}
    catch(e){b.disabled=false;b.textContent='E-posta bildirimlerinden çık';$('err').textContent=e.message}}}
// 094: memnuniyet anketi (#anket=<anahtar>) ve Google yorum yönlendirmesi (#yorum=<kayıt>&u=<bağlantı>)
const SUPA=API.replace(/\/functions\/v1\/sadakat$/,'');
async function rpcAnon(fn,args){let r;try{r=await fetch(SUPA+'/rest/v1/rpc/'+fn,{method:'POST',keepalive:true,headers:{'content-type':'application/json',apikey:KEY,authorization:'Bearer '+KEY},body:JSON.stringify(args)})}
  catch(e){throw new Error('Bağlantı kurulamadı. İnternetinizi kontrol edip tekrar deneyin.')}
  let j=null;try{j=await r.json()}catch(e){}if(!r.ok)throw new Error((j&&j.message)||'İşlem yapılamadı');return j}
const GOK=u=>{try{const x=new URL(u);return x.protocol==='https:'&&/^(g\.page|search\.google\.com|www\.google\.com|maps\.google\.com|maps\.app\.goo\.gl|goo\.gl)$/.test(x.hostname)}catch(e){return false}};
async function goReview(id,u){app.innerHTML='<div class="card center"><div class="spin"></div><p class="sub">Google yorum sayfasına yönlendiriliyorsunuz…</p></div>';
  let url=GOK(u)?u:'';try{const r=await Promise.race([rpcAnon('review_click',{p_id:id}),new Promise((_,j)=>setTimeout(()=>j(new Error('t')),2500))]);if(GOK(r))url=r}catch(e){}
  if(url)location.replace(url);else app.innerHTML='<div class="card"><p class="err">Bağlantı açılamadı. Lütfen Google Haritalar\'da "Anka İletişim" araması yaparak yorum bırakın.</p></div>'}
const SV={d:null,score:0,staff:0,nps:null,busy:false,err:''};
// e-posta "Deneme gönder" bağlantısı (CepOS › E-posta bildirimleri): sıfır anahtar → örnek anket; cevap sunucuya gönderilmez
const SV_DEMO='00000000-0000-0000-0000-000000000000';
function stars(name,v,label){return `<label>${label}</label><div class="row" role="radiogroup" aria-label="${esc(label)}" style="gap:6px">${[1,2,3,4,5].map(i=>`<button type="button" class="sv-st${i<=v?' on':''}" data-sv="${name}" data-v="${i}" aria-label="${i} yıldız" aria-pressed="${i===v}">★</button>`).join('')}</div>`}
function vSurvey(){const d=SV.d;
  if(!d){app.innerHTML='<div class="spin"></div>';return}
  if(!d.ok){app.innerHTML='<div class="card"><h1>Anket bulunamadı</h1><p class="sub">Bağlantı geçersiz. E-postadaki bağlantıyı yeniden açmayı deneyin.</p></div>';return}
  const demo=d.demo?`<div class="note sv-demo"><b>Deneme e-postası</b> · Bu, CepOS'tan gönderilen deneme e-postasının örnek anketidir. Müşterinin göreceği ekran budur; burada verilen cevaplar kaydedilmez, puan yüklenmez.</div>`:'';
  if(d.done&&d.demo){app.innerHTML=`<div class="card center"><div style="font-size:44px">💝</div><h1>Teşekkür ederiz!</h1><p class="sub">Müşteriniz anketi gönderince bu teşekkür ekranını görür${d.points?' ve puanı hesabına hemen yüklenir':''}.</p>${demo}</div>`;return}
  if(d.done){app.innerHTML=`<div class="card center"><div style="font-size:44px">💝</div><h1>Teşekkür ederiz${d.ad?', '+esc(d.ad):''}!</h1><p class="sub">Görüşleriniz bize ulaştı.</p>
    ${d.got?`<div class="card bal" style="margin-top:12px"><div class="k">Hesabınıza yüklendi</div><div class="v">+${num(d.got)}</div><div class="e">puan${d.avail!=null?` · kullanılabilir bakiye ${num(d.avail)} puan`:''}</div></div>`:''}</div>`;return}
  if(d.answered){app.innerHTML=`<div class="card center"><h1>Teşekkür ederiz!</h1><p class="sub">Bu anketi daha önce doldurdunuz.</p></div>`;return}
  if(d.expired){app.innerHTML=`<div class="card"><h1>Anketin süresi doldu</h1><p class="sub">Bu anketin süresi dolmuş. Görüşlerinizi mağazamıza her zaman iletebilirsiniz.</p></div>`;return}
  app.innerHTML=`<div class="card">${demo}<h1>Alışverişinizi nasıl buldunuz?</h1><p class="sub">Merhaba ${esc(d.ad||'')}, ${d.sold_at?esc(dt(d.sold_at))+' tarihindeki ':''}alışverişinizi değerlendirin. Cevaplarınızı yalnızca ${esc(d.shop||'mağazamız')} görür.</p>
    ${d.points?`<div class="note" style="background:var(--pinkbg);color:var(--pinktx)">Anketi tamamlayınca <b>${num(d.points)} puan</b> sadakat hesabınıza hemen yüklenir.</div>`:''}
    ${stars('score',SV.score,'Genel olarak memnun kaldınız mı?')}
    ${stars('staff',SV.staff,(d.staff?esc(d.staff)+' ':'Personelimizin ')+'ilgisi nasıldı? (isteğe bağlı)')}
    <label>Bizi bir arkadaşınıza önerir misiniz? <span class="sub">(0 = hiç, 10 = kesinlikle)</span></label>
    <div class="sv-nps">${Array.from({length:11},(_,i)=>`<button type="button" class="sv-n${SV.nps===i?' on':''}" data-sv="nps" data-v="${i}">${i}</button>`).join('')}</div>
    <label for="sv-c">Eklemek istedikleriniz <span class="sub">(isteğe bağlı)</span></label><textarea class="in" id="sv-c" rows="3" maxlength="1000" style="font-size:16px" placeholder="Beğendikleriniz, geliştirmemizi istedikleriniz…">${esc(SV.c||'')}</textarea>
    <button class="btn pri" id="sv-go" ${SV.busy?'disabled':''}>${SV.busy?'Gönderiliyor…':'Gönder'}</button><div class="err">${esc(SV.err)}</div></div>`;
  app.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{SV.c=$('sv-c').value;const k=b.dataset.sv,v=+b.dataset.v;if(k==='nps')SV.nps=v;else SV[k]=v;SV.err='';vSurvey()});
  $('sv-go').onclick=submitSurvey}
async function submitSurvey(){SV.c=$('sv-c').value;if(!SV.score){SV.err='Lütfen genel memnuniyetinizi yıldızlarla belirtin.';return vSurvey()}
  if(SV.d&&SV.d.demo){SV.d={...SV.d,done:true};return vSurvey()}
  SV.busy=true;SV.err='';vSurvey();
  try{const r=await rpcAnon('survey_submit',{p_token:SV.tok,p:{score:SV.score,staff_score:SV.staff||null,nps:SV.nps,comment:SV.c}});SV.d={...SV.d,done:true,got:r&&r.points,avail:r&&r.avail}}
  catch(e){SV.err=e.message}SV.busy=false;vSurvey()}
async function loadSurvey(tok){SV.tok=tok;if(tok===SV_DEMO){SV.d={ok:true,demo:true,ad:'Ayşe',sold_at:new Date(Date.now()-864e5).toISOString(),staff:'Emre'};return vSurvey()}vSurvey();try{SV.d=await rpcAnon('survey_get',{p_token:tok})}catch(e){SV.d={ok:false}}vSurvey()}
const RET=(location.hash.match(/^#eposta-ret=([0-9a-f-]{36})$/i)||[])[1],ANK=(location.hash.match(/^#anket=([0-9a-f-]{36})$/i)||[])[1],
  YRM=location.hash.match(/^#yorum=([0-9a-f-]{36})(?:&u=([^&]+))?$/i);
if(YRM)goReview(YRM[1],YRM[2]?decodeURIComponent(YRM[2]):'');else if(ANK)loadSurvey(ANK);else if(RET)vRet(RET);else if(S.tok)load();else render();
</script>
