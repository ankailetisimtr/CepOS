@media (max-width:860px){.sale-grid{grid-template-columns:1fr}}
.cartline{display:grid;grid-template-columns:1fr 110px 90px auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}

.sum{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}.sum.big{font-size:18px;font-weight:600;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.bell{position:relative}.bell .n{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 3px}
.dd{position:absolute;right:0;top:44px;width:min(360px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;z-index:40;max-height:60vh;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.dd .it{padding:8px 0;border-bottom:1px solid var(--line)}.dd .it:last-child{border-bottom:0}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}svg.chart .gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}
.oprow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}.oprow:last-child{border-bottom:0}.oprow b{font-variant-numeric:tabular-nums}
.qline{display:grid;grid-template-columns:2fr .6fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}.qline .qd{min-width:0}
@media (max-width:640px){.qline{grid-template-columns:1fr 1fr 1fr auto}.qline .qd{grid-column:1/-1}}
.qdoc{background:#fff;color:#111;padding:18px;border-radius:6px;border:1px solid var(--line)}.qdoc th,.qdoc td{color:#111;border-color:#ddd}
@media print{body *{visibility:hidden}.qdoc,.qdoc *{visibility:visible}.qdoc{position:absolute;left:0;top:0;width:100%;border:0}.no-print{display:none!important}}
.inl{display:flex;gap:6px;align-items:stretch}.inl .in{flex:1;min-width:0}
.thumb{max-width:100%;max-height:220px;border-radius:6px;margin-top:6px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>

const CFG={
  URL:'https://pridaaqceuwirmfkefmu.supabase.co',
  KEY:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByaWRhYXFjZXV3aXJtZmtlZm11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NDk1NjcsImV4cCI6MjEwOTEyNTU2N30.pDDUHdjectIRhLYH7crDcUgUW4HRk-wU3tVhTP8auhc'
};
const CATS=['Akıllı Telefon','Tabletler','Akıllı Saatler'],SUBS=['Sıfır','2.El','Yenilenmiş'];
const COSM=['Kusursuz','Çok İyi','İyi','Orta','Hasarlı / Kırık'],WARR=['Garantisiz','Distribütör Garantili','İthalatçı Garantili','Mağaza Garantili'];
const METHODS=[['nakit','Nakit'],['pos','POS'],['havale','Havale']];
const MOVES=[['gider','Masraf / Gider'],['diger_gelir','Diğer Gelir'],['acilis','Açılış Bakiyesi'],['sermaye_sahip','Sahip Sermaye Girişi'],['sahip_cekimi','Sahip Çekimi'],['duzeltme_arti','Düzeltme (+)'],['duzeltme_eksi','Düzeltme (-)']];
const TYPE_LABEL={satis:'Satış',alis:'Ürün alışı',iade:'İade',gider:'Masraf',diger_gelir:'Diğer gelir',acilis:'Açılış',sermaye_sahip:'Sahip sermayesi',sahip_cekimi:'Sahip çekimi',
  duzeltme_arti:'Düzeltme (+)',duzeltme_eksi:'Düzeltme (-)',transfer:'Transfer',cari_odeme:'Cari ödeme',sermaye:'Yatırım sermayesi',
  alis_borc:'Veresiye alış',odeme:'Ödeme',sermaye_girisi:'Sermaye girişi',sermaye_iadesi:'Sermaye iadesi',hakedis:'Hakediş',hakedis_iptal:'Hakediş iptali',hakedis_odeme:'Hakediş ödemesi'};
const ROLES=[['owner','İşletme sahibi'],['manager','Mağaza müdürü'],['staff','Personel']];
const MON=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const TABS=[['panel','Panel',null],['satis','Satış','make_sale'],['stok','Stok',null],['satislar','Satışlar',null],['servis','Servis','manage_service'],['siparis','Siparişler','manage_orders'],['teklif','Teklifler','manage_quotes'],['gorev','Görevler',null],['vardiya','Vardiya',null],['hedef','Hedefler',null],['kasa','Kasa','view_cash'],['kisiler','Kişiler',null],['konsinye','Konsinye','view_consignment'],['yonetim','Yönetim','manage_users']];

/* ================= YARDIMCILAR ================= */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmtDate=s=>s?String(s).slice(0,10).split('-').reverse().join('.'):'';
const dayOf=ts=>ts?iso(new Date(ts)):'';
const fmtTime=ts=>{const d=new Date(ts);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const money=n=>n==null?'-':(Math.round(n*100)/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
const num=n=>(n||0).toLocaleString('tr-TR');
const sum=(a,f)=>a.reduce((t,x)=>t+(Number(f(x))||0),0);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sgn=n=>n<0?'neg':n>0?'pos':'';
const opts=(arr,sel,blank)=>(blank!==undefined?`<option value="">${esc(blank)}</option>`:'')+arr.map(x=>{const[v,t]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}"${v===sel?' selected':''}>${esc(t)}</option>`}).join('');
const g=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const nv=id=>{const v=g(id);return v===''?null:Number(v.replace(',','.'))};
const label=(t)=>TYPE_LABEL[t]||t;
function msg(e){const m=(e&&e.message)||String(e);return m.replace(/^.*?:\s*/,m=>m)}

/* ================= DURUM ================= */
const sb=window.supabase.createClient(CFG.URL,CFG.KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const S={user:null,me:null,perms:new Set(),d:null,loading:false,agr:{},dash:null,mine:null,notifOpen:false,seen:0,
  ui:{tab:'panel',period:'month',ref:today(),from:today(),to:today(),q:'',fs:'stokta',fo:'',fc:'',kasaAcc:'',kasaDate:today(),kind:'musteri',openSale:'',salesRange:'7',openAgr:'',ekstre:''},
  cart:{items:[],trades:[],pays:[],customer:'',staff:'',note:'',q:''}};
const can=p=>!!S.me&&(S.me.role==='owner'||S.perms.has(p));
const by=(arr)=>new Map(arr.map(x=>[x.id,x]));

const NOID=new Set(['staff_settings','role_permissions','product_costs','sale_item_costs']);
async function all(table,order,asc){
  let out=[],from=0;
  for(;;){
    let q=sb.from(table).select('*');
    if(order)q=q.order(order,{ascending:!!asc});
    if(!NOID.has(table))q=q.order('id',{ascending:true});
    q=q.range(from,from+999);
    const {data,error}=await q;if(error)throw error;
    out=out.concat(data||[]);if(!data||data.length<1000)break;from+=1000}
  return out}
async function loadAll(){
  S.ops=undefined;S.work=undefined;S.team=null;S.tp=null;
  const names=['profiles','staff_settings','role_permissions','contacts','products','product_costs','sales','sale_items','sale_payments','sale_trade_ins','sale_item_costs','commissions','sale_returns','cash_entries','party_entries','consignment_agreements','consignment_rates','notifications','service_orders','service_events','customer_orders','follow_ups','quotes','quote_items','attachments','shifts','time_clock','tasks','push_subscriptions'];
  const orders={sales:'sold_at',cash_entries:'created_at',notifications:'created_at',party_entries:'created_at',service_orders:'received_at',service_events:'at',quotes:'created_at',attachments:'created_at',time_clock:'clock_in',tasks:'created_at'};
  const res=await Promise.all(names.map(n=>all(n,orders[n],false).catch(e=>{console.warn(n,e);return []})));
  const d={};names.forEach((n,i)=>d[n]=res[i]);
  S.d=d;
  S.me=d.profiles.find(p=>p.id===S.user.id)||null;
  S.perms=new Set(d.role_permissions.filter(r=>S.me&&r.role===S.me.role&&r.allowed).map(r=>r.permission));
  d.contactMap=by(d.contacts);d.productMap=by(d.products);d.profileMap=by(d.profiles);d.saleMap=by(d.sales);
  d.cost=new Map(d.product_costs.map(c=>[c.product_id,Number(c.cost)]));
  d.itemCost=new Map(d.sale_item_costs.map(c=>[c.sale_item_id,c]));
  d.itemsBySale=new Map();d.sale_items.forEach(i=>{if(!d.itemsBySale.has(i.sale_id))d.itemsBySale.set(i.sale_id,[]);d.itemsBySale.get(i.sale_id).push(i)});
  d.soldAt=new Map();d.sale_items.forEach(i=>{if(!i.returned){const s=d.saleMap.get(i.sale_id);if(s)d.soldAt.set(i.product_id,s.sold_at)}});
  d.latestRate=new Map();d.consignment_rates.forEach(r=>{const k=r.agreement_id+'|'+r.cat+'|'+r.sub;const o=d.latestRate.get(k);if(!o||r.valid_from>=o.valid_from)d.latestRate.set(k,r)});
}
let refreshT=null;
function refreshSoon(){clearTimeout(refreshT);refreshT=setTimeout(async()=>{try{await loadAll();S.dash=null;S.agr={};render()}catch(e){}},900)}
function subscribe(){
  try{sb.channel('anka-bildirim').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},p=>{
    const n=p.new||{};if(n.actor_id!==(S.user&&S.user.id))toast(n.title+(n.body?' · '+n.body:''));refreshSoon()}).subscribe()}catch(e){}}

function toast(t,bad){const el=document.getElementById('toast');el.innerHTML=`<div class="toast${bad?' bad':''}">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>el.innerHTML='',bad?5000:2600)}
async function call(name,args,okMsg){
  const {data,error}=await sb.rpc(name,args||{});
  if(error){toast(error.message,true);throw error}
  if(okMsg)toast(okMsg);return data}
async function reload(){await loadAll();S.dash=null;S.agr={};render()}

/* ================= AÇILIŞ / GİRİŞ ================= */
async function boot(){
  try{
    const {data}=await sb.auth.getSession();
    if(!data.session){S.user=null;return renderLogin()}
    S.user=data.session.user;await loadAll();

function catReport(a,b){
  const rows=[];
  for(const c of CATS)for(const s of SUBS){
    let cnt=0,rev=0,cost=0,known=true;
    for(const it of S.d.sale_items){if(it.returned)continue;const sl=S.d.saleMap.get(it.sale_id);if(!sl)continue;const d=dayOf(sl.sold_at);if(d<a||d>b)continue;
      const p=S.d.productMap.get(it.product_id);if(!p||p.cat!==c||p.sub!==s)continue;
      cnt++;rev+=Number(it.price)-Number(it.discount);const ic=S.d.itemCost.get(it.id);if(ic)cost+=Number(ic.cost)+Number(ic.consignor_share);else known=false}
    const st=S.d.products.filter(p=>p.cat===c&&p.sub===s&&p.status!=='satildi');
    rows.push({c,s,cnt,rev,profit:known?rev-cost:null,stockN:st.length,stockV:sum(st,p=>S.d.cost.get(p.id)||0)})}
  return `<div class="card"><h2>Kategori raporu</h2><div class="tw"><table><tr><th>Kategori</th><th>Satış adet</th><th>Ciro</th>${can('view_profit')?'<th>Anka brüt kâr</th>':''}<th>Stok adet</th>${can('view_cost')?'<th>Stok değeri</th>':''}</tr>
  ${rows.map(x=>`<tr><td>${esc(x.c)} · ${esc(x.s)}</td><td>${x.cnt}</td><td>${money(x.rev)}</td>${can('view_profit')?`<td class="${sgn(x.profit||0)}">${x.profit==null?'-':money(x.profit)}</td>`:''}<td>${x.stockN}</td>${can('view_cost')?`<td>${money(x.stockV)}</td>`:''}</tr>`).join('')}</table></div></div>`}
function chart(){
  const rows=S.dash.months,W=720,H=230,L=48,R=6,T=12,B=26;
  const vals=rows.flatMap(r=>[r.rev,r.net==null?0:r.net]);
  const maxV=Math.max(1,...vals),minV=Math.min(0,...vals);
  const step=(()=>{const x=(maxV-minV)/4;if(!(x>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(x))),n=x/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p})();
  const top=Math.ceil(maxV/step)*step,bot=Math.floor(minV/step)*step;
  const y=v=>T+(H-T-B)*(1-(v-bot)/(top-bot)),slot=(W-L-R)/12,bw=slot*.3;
  const cp=v=>{const a=Math.abs(v);return(v<0?'-':'')+(a>=1e6?(a/1e6).toFixed(1)+' Mn':a>=1e3?Math.round(a/1e3)+' bin':Math.round(a))};
  let gr='';for(let v=bot;v<=top+step/2;v+=step)gr+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${cp(v)}</text>`;
  const bar=(v,x,c)=>{const y0=y(0),y1=y(v);return `<rect x="${x}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y0-y1))}" rx="2" fill="${c}"/>`};
  const bars=rows.map((r,i)=>{const x0=L+i*slot+slot*.17;return bar(r.rev,x0,'var(--accent)')+(r.net==null?'':bar(r.net,x0+bw+3,'var(--good)'))+`<text x="${L+i*slot+slot/2}" y="${H-8}" text-anchor="middle">${MON[i]}</text>`}).join('');
  return `<div class="legend"><span><i style="background:var(--accent)"></i>Ciro</span>${rows.some(r=>r.net!=null)?'<span><i style="background:var(--good)"></i>Anka net kazancı</span>':''}</div><div class="tw"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="Aylık ciro ve net kazanç">${gr}${bars}</svg></div>`}

async function saveProduct(id){
  const model=g('p-model');if(!model)return setErr('Marka / model yazın.');
  const imei=g('p-imei');
  if(isImei(imei)&&!luhn(imei)&&S.imeiWarn!==imei){S.imeiWarn=imei;return setErr('Bu IMEI’nin sağlama hanesi tutmuyor, yanlış yazılmış olabilir. Doğruysa tekrar Kaydet’e basın.')}
  if(imei&&S.d.products.some(x=>x.imei===imei&&x.id!==id&&x.status!=='satildi'))return setErr('Bu IMEI başka bir üründe stokta kayıtlı.');
  try{
    if(id){
      const {error}=await sb.from('products').update({cat:g('p-cat'),sub:g('p-sub'),model,imei:imei||null,battery:nv('p-bat'),cosmetic:g('p-cos')||null,warranty:g('p-war')||null,target_price:nv('p-target'),notes:g('p-notes')||null}).eq('id',id);
      if(error)throw error;
      if(document.getElementById('p-cost')&&can('view_cost')&&nv('p-cost')!=null){const r=await sb.from('product_costs').update({cost:nv('p-cost')}).eq('product_id',id);if(r.error)throw r.error}
      toast('Ürün güncellendi')}
    else{
      const cost=nv('p-cost');if(cost==null||cost<0)return setErr('Maliyet tutarını girin.');
      const kind=g('p-src')==='toptan'?'firma':'musteri',contact=await resolveContact(kind,'p-bc');
      const paid=nv('p-paid');const owner=g('p-owner')||'anka';
      if(owner==='konsinye'&&!g('p-agr'))return setErr('Konsinye anlaşması seçin.');
      await call('create_product',{p:{cat:g('p-cat'),sub:g('p-sub'),model,imei,battery:g('p-bat'),cosmetic:g('p-cos'),warranty:g('p-war'),buy_date:g('p-date'),buy_source:g('p-src'),buy_contact_id:contact||'',
        target_price:g('p-target'),notes:g('p-notes'),owner,agreement_id:owner==='konsinye'?g('p-agr'):'',cost,paid_amount:paid==null?cost:paid,pay_method:g('p-pay')}},'Ürün stoğa eklendi')}
    closeModal();await reload()}
  catch(e){setErr(msg(e))}}

async function loadThumbs(){
  const imgs=[...document.querySelectorAll('#doc-list img.thumb')];if(!imgs.length)return;
  try{const r=await sb.storage.from('anka-docs').createSignedUrls(imgs.map(i=>i.dataset.path),600);
    (r.data||[]).forEach(x=>{const im=imgs.find(i=>i.dataset.path===x.path);if(im&&x.signedUrl){im.src=x.signedUrl;im.style.display='block'}})}catch(e){}}
async function shrink(file){
  if(!file.type.startsWith('image/')||file.type==='image/heic')return file;
  try{const bmp=await createImageBitmap(file),k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
    return blob&&blob.size<file.size?new File([blob],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file}catch(e){return file}}
async function uploadDocs(files){
  const {rt,id}=S.docs,kind=g('doc-kind'),note=g('doc-note')||null;let n=0;
  for(const f0 of files){
    try{const f=await shrink(f0);
      if(f.size>10485760){setErr(f0.name+': 10 MB sınırını aşıyor');continue}
      if(!/^(image\/|application\/pdf)/.test(f.type)){setErr(f0.name+': yalnızca resim veya PDF');continue}
      const safe=f.name.replace(/[^\w.\-]+/g,'_'),path=`${kind}/${rt}/${id}/${crypto.randomUUID().slice(0,8)}-${safe}`;
      const up=await sb.storage.from('anka-docs').upload(path,f,{contentType:f.type});if(up.error)throw up.error;
      const ins=await sb.from('attachments').insert({kind,ref_table:rt,ref_id:id,path,file_name:f.name,mime:f.type,size_bytes:f.size,note,branch_id:S.me.branch_id});
      if(ins.error){await sb.storage.from('anka-docs').remove([path]);throw ins.error}
      n++}catch(e){setErr(msg(e))}}
  if(n){toast(n+' dosya yüklendi');S.d.attachments=await all('attachments','created_at',false).catch(()=>S.d.attachments);render();docsModal(rt,id)}}

/* ================= BARKOD / IMEI OKUTMA ================= */
const luhn=s=>{let t=0;[...s].reverse().forEach((c,i)=>{let d=+c;if(i%2){d*=2;if(d>9)d-=9}t+=d});return t%10===0};
const isImei=s=>/^\d{15}$/.test(s);
// okunan değer kabul edilir mi? 15 haneli ise sağlama hanesi tutmalı; EAN/UPC gibi ürün barkodları reddedilir
function scanOk(v){v=String(v||'').trim();if(!v)return null;
  if(isImei(v))return luhn(v)?v:null;
  if(/^\d{12,14}$/.test(v))return null;
  return /^[A-Za-z0-9\-]{6,20}$/.test(v)?v.toUpperCase():null}
let scanState=null;
function scanStop(){const s=scanState;scanState=null;if(!s)return;
  s.stopped=true;clearInterval(s.timer);try{s.reader&&s.reader.reset()}catch(e){}
  try{s.stream&&s.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  const o=document.getElementById('scan');if(o)o.remove()}
function scanDone(v){const t=scanState&&scanState.target;scanStop();if(t)scanApply(t,v)}
function scanApply(target,v){
  if(target==='cq'){const p=S.d.products.find(x=>x.status==='stokta'&&x.imei&&x.imei.toUpperCase()===v);
    if(p){toast(p.model+' sepete eklendi');return cartAdd(p.id)}
    S.cart.q=v;render();toast('Stokta bu IMEI ile ürün yok: '+v,true);return}
  const el=document.getElementById(target);if(!el)return;
  el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));toast('Okundu: '+v)}
function loadZX(){return new Promise((ok,no)=>{if(window.ZXing)return ok();const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=ok;s.onerror=()=>no(new Error('Okuyucu kütüphanesi yüklenemedi'));document.head.appendChild(s)})}
async function startScan(target){
  scanStop();
  const o=document.createElement('div');o.id='scan';o.className='ov';
  o.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h2>Barkod / IMEI okut</h2>
   <video id="scan-v" playsinline muted style="width:100%;max-height:50vh;background:#000;border-radius:8px"></video>
   <p class="sub" id="scan-s">Kamera açılıyor…</p>
   <label class="f">Okunamıyorsa elle yazın<input class="in mono" id="scan-m" inputmode="numeric" placeholder="IMEI / seri no"></label>
   <div class="actions"><button class="btn" data-a="scan-cancel">Kapat</button><button class="btn pri" data-a="scan-manual">Kullan</button></div></div>`;
  document.body.appendChild(o);scanState={target};
  const say=t=>{const e=document.getElementById('scan-s');if(e)e.textContent=t};
  const vid=document.getElementById('scan-v');
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Bu tarayıcı kamerayı açamıyor (HTTPS gerekir)');
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['code_128','code_39','ean_13','ean_8','itf','codabar','qr_code','data_matrix','upc_a']});
      const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      if(!scanState)return st.getTracks().forEach(t=>t.stop());
      scanState.stream=st;vid.srcObject=st;vid.play().catch(()=>{});say('IMEI barkodunu çerçeveye getirin');
      scanState.timer=setInterval(async()=>{if(!scanState||scanState.busy)return;scanState.busy=true;
        try{const r=await det.detect(vid);for(const b of r){const v=scanOk(b.rawValue);if(v){scanDone(v);break}}}catch(e){}
        if(scanState)scanState.busy=false},250)}
    else{
      say('Okuyucu yükleniyor…');await loadZX();if(!scanState)return;
      const rd=new ZXing.BrowserMultiFormatReader();scanState.reader=rd;
      await rd.decodeFromVideoDevice(undefined,vid,(res)=>{if(!res||!scanState)return;const v=scanOk(res.getText());if(v)scanDone(v)});
      say('IMEI barkodunu çerçeveye getirin')}}
  catch(e){say('Kamera kullanılamadı: '+msg(e)+'. IMEI\'yi elle yazabilirsiniz.')}}

/* ================= TELEFON BİLDİRİMLERİ (Web Push) ================= */
const PKINDS=[['satis','Satışlar (tutarlı)'],['iade','İadeler (tutarlı)'],['servis','Servis hazır / teslim'],['siparis','Sipariş hazır'],['gorev','Bana atanan görevler']];
const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const b64ToBytes=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function swReg(){
  if(!('serviceWorker' in navigator))return null;
  try{S.swReg=S.swReg||await navigator.serviceWorker.register('sw.js');return S.swReg}catch(e){return null}}
function swListen(){
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.addEventListener('message',e=>{const h=e.data&&e.data.type==='goto'&&e.data.hash;if(h){location.hash=h;S.ui.tab=h.slice(1);if(S.d)render()}})}
async function pushState(){
  const st={supported:pushSupported(),perm:'Notification' in window?Notification.permission:'denied',sub:null,kinds:null};
  if(!st.supported)return st;
  try{const reg=await swReg();if(reg){await navigator.serviceWorker.ready;st.sub=await reg.pushManager.getSubscription()}}catch(e){}
  if(st.sub){const row=(S.d.push_subscriptions||[]).find(x=>x.endpoint===st.sub.endpoint);st.kinds=row?row.kinds:null;st.known=!!row}
  return st}
async function pushModal(){
  S.notifOpen=false;
  modal('<h2>Telefon bildirimleri</h2><div class="sub">Kontrol ediliyor…</div>');
  const st=await pushState(),iosHint=/iPhone|iPad|iPod/.test(navigator.userAgent);
  let body;
  if(!st.supported)body=`<p>Bu tarayıcı uygulama kapalıyken bildirim desteklemiyor.</p>${iosHint?'<p class="sub">iPhone\'da önce Safari\'de <b>Paylaş &gt; Ana Ekrana Ekle</b> yapın, sonra uygulamayı ana ekrandaki simgeden açıp tekrar deneyin (iOS 16.4 ve üstü gerekir).</p>':''}`;
  else if(st.perm==='denied')body='<p>Bildirim izni engellenmiş. Tarayıcı veya telefon ayarlarından bu site için bildirimlere izin verin, sonra tekrar deneyin.</p>';
  else{
    const on=!!st.sub,sel=st.kinds;
    body=`<p>${on?'<b class="pos">Bu cihazda bildirimler açık.</b>':'Bu cihazda bildirimler kapalı.'}</p>
    ${on?`<div class="form">${PKINDS.map(([k,t])=>`<label class="chk"><input type="checkbox" data-c="pkind" data-k="${k}" ${!sel||sel.includes(k)?'checked':''}> ${t}</label>`).join('')}</div>
      <p class="sub">Satış ve iade bildirimleri tutar içerdiği için yalnızca tüm satışları görebilen kişilere gider.</p>`:''}

async function pushOn(){
  try{
    const perm=await Notification.requestPermission();if(perm!=='granted')return setErr('İzin verilmedi.');
    const k=await sb.functions.invoke('push-notify',{body:{action:'key'}});
    if(k.error||!k.data||!k.data.publicKey){let m='Bildirim sunucusu kurulu değil veya ayarı eksik.';try{const j=await k.error.context.json();if(j&&j.error)m=j.error}catch(e){}return setErr(m)}
    const reg=await swReg();if(!reg)return setErr('Servis çalışanı başlatılamadı (adres https olmalı ve sw.js yüklenmiş olmalı).');
    await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(k.data.publicKey)});
    const j=sub.toJSON();
    await call('save_push_subscription',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_kinds:null,p_ua:navigator.userAgent});
    S.d.push_subscriptions=await all('push_subscriptions').catch(()=>[]);toast('Bildirimler açıldı');pushModal()}
  catch(e){setErr(msg(e))}}
async function pushOff(){
  try{const reg=await swReg(),sub=reg&&await reg.pushManager.getSubscription();
    if(sub){await call('delete_push_subscription',{p_endpoint:sub.endpoint});await sub.unsubscribe()}
    S.d.push_subscriptions=await all('push_subscriptions').catch(()=>[]);toast('Bildirimler kapatıldı');pushModal()}
  catch(e){setErr(msg(e))}}
async function pushLeave(){ // çıkışta bu cihazın aboneliği kapatılır (ortak cihazda başkasının bildirimi görünmesin)
  try{if(!pushSupported())return;const reg=await swReg(),sub=reg&&await reg.pushManager.getSubscription();
    if(sub){await sb.rpc('delete_push_subscription',{p_endpoint:sub.endpoint});await sub.unsubscribe()}}catch(e){}}

      if(id){const r=await sb.from('quotes').update(o).eq('id',id);if(r.error)throw r.error;const d=await sb.from('quote_items').delete().eq('quote_id',id);if(d.error)throw d.error}
      else{const r=await sb.from('quotes').insert({...o,branch_id:S.me.branch_id}).select('id').single();if(r.error)throw r.error;qid=r.data.id}
      const ins=await sb.from('quote_items').insert(its.map((i,ix)=>({quote_id:qid,product_id:i.pid||null,description:i.desc.trim(),qty:Math.round(Number(i.qty)),unit_price:Number(i.price),discount:Number(i.disc)||0,position:ix})));
      if(ins.error)throw ins.error;toast('Teklif kaydedildi');closeModal();await reload()}catch(e){setErr(msg(e))}},
  async 'q-email'(t){const q=S.d.quotes.find(x=>x.id===t.dataset.id);
    if(!armed(t,q.customer_email+' adresine gönderilsin mi?'))return;
    t.disabled=true;t.textContent='Gönderiliyor…';
    try{const r=await sb.functions.invoke('send-quote',{body:{quote_id:q.id}});
      if(r.error){let m=r.error.message||'Gönderilemedi';try{const j=await r.error.context.json();if(j&&j.error)m=j.error}catch(e){}
        if(/not found|404|Failed to send|fetch/i.test(m)&&!/Teklif/.test(m))m='Otomatik gönderim kurulu değil veya ulaşılamıyor. "Mail uygulaması" düğmesini kullanabilirsiniz. ('+m+')';
        toast(m,true);t.disabled=false;t.textContent='E-posta gönder';delete t.dataset.armed;return}
      toast('Teklif '+q.customer_email+' adresine gönderildi'+(r.data&&r.data.warn?' · '+r.data.warn:''));await reload()}
    catch(e){toast(msg(e),true);t.disabled=false;t.textContent='E-posta gönder';delete t.dataset.armed}},
  'q-preview'(t){qPreview(t.dataset.id)},'q-print'(){window.print()},
  async 'q-share'(t){const q=S.d.quotes.find(x=>x.id===t.dataset.id);
    if(q&&q.status==='taslak'){const r=await sb.from('quotes').update({status:'gonderildi',sent_at:new Date().toISOString(),sent_via:t.dataset.via}).eq('id',q.id);if(!r.error)setTimeout(reload,600)}},
  'q-tosale'(t){const q=S.d.quotes.find(x=>x.id===t.dataset.id);let n=0,miss=0;
    qItems(q.id).forEach(i=>{const p=i.product_id&&S.d.productMap.get(i.product_id);
      if(p&&p.status==='stokta'){if(!S.cart.items.some(c=>c.pid===p.id)){S.cart.items.push({pid:p.id,price:Number(i.unit_price),discount:Number(i.discount)||0});n++}}else miss++});
    if(q.contact_id)S.cart.customer=q.contact_id;
    toast(n?`${n} cihaz sepete eklendi`+(miss?`, ${miss} kalem stokta bulunamadı`:''):'Sepete eklenecek stoklu cihaz yok',!n);
    if(n){location.hash='satis';S.ui.tab='satis';render()}},
  async 'q-del'(t){if(!armed(t,'Emin misiniz?'))return;const r=await sb.from('quotes').delete().eq('id',t.dataset.id);r.error?toast(r.error.message,true):(toast('Teklif silindi'),reload())},
  async 'save-rates'(t){const id=t.dataset.id;let n=0;
    try{for(let ix=0;ix<9;ix++){const v=nv('rt-'+ix);if(v==null)continue;await call('set_consignment_rate',{p_agreement:id,p_cat:CATS[Math.floor(ix/3)],p_sub:SUBS[ix%3],p_share:v,p_valid_from:g('rt-date')});n++}
      toast(n?n+' pay güncellendi':'Değişiklik yok');closeModal();await reload()}catch(e){setErr(msg(e))}}
};
document.addEventListener('click',e=>{
  if(S.notifOpen&&!e.target.closest('.bell')){S.notifOpen=false;S.seen=Date.now();render()}
  const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f)f(t,e)});
document.addEventListener('change',async e=>{
  const t=e.target,c=t.dataset.c;
  if(t.id==='doc-file'||t.id==='doc-cam'){const fl=[...t.files];t.value='';if(fl.length)await uploadDocs(fl);return}if(!c&&!t.id)return;
  if(t.tagName==='SELECT'&&t.id&&document.getElementById(t.id+'-new')){document.getElementById(t.id+'-new').hidden=t.value!=='__new__';if(t.id==='s-cust')S.cart.customer=t.value;return}
  const i=+t.dataset.i;
  switch(c){
    case 'ref':S.ui.ref=t.value||today();S.dash=null;render();break;
    case 'range':S.ui.from=g('p-from')||S.ui.from;S.ui.to=g('p-to')||S.ui.to;S.dash=null;render();break;
    case 'stokfilter':if(t.id!=='q'){S.ui.fs=g('fs');S.ui.fo=g('fo');S.ui.fc=g('fc');stokList()}break;
    case 'kasadate':S.ui.kasaDate=t.value||today();render();break;
    case 'kasaacc':S.ui.kasaAcc=t.value;render();break;
    case 'cartstaff':S.cart.staff=t.value;break;
    case 'cartnote':S.cart.note=t.value;break;
    case 'paymethod':S.cart.pays[i].method=t.value;break;
    case 'srcchg':{const k=t.value==='toptan'?'firma':'musteri';document.getElementById('p-contact').innerHTML=csel('p-bc',k,'',k==='firma'?'Firma':'Müşteri');break}
    case 'ownerchg':document.getElementById('p-agr-w').hidden=t.value!=='konsinye';break;
    case 'pname':{const r=await sb.from('profiles').update({full_name:t.value.trim()}).eq('id',t.dataset.id);r.error?toast(r.error.message,true):(toast('Kaydedildi'),reload());break}
    case 'prole':{const r=await sb.from('profiles').update({role:t.value}).eq('id',t.dataset.id);r.error?toast(r.error.message,true):(toast('Rol güncellendi'),reload());break}
    case 'pactive':{const r=await sb.from('profiles').update({active:t.checked}).eq('id',t.dataset.id);r.error?toast(r.error.message,true):(toast('Kaydedildi'),reload());break}
    case 'pset':{const r=await sb.from('staff_settings').update({[t.dataset.f]:Number(t.value)||0}).eq('profile_id',t.dataset.id);r.error?toast(r.error.message,true):(toast('Kaydedildi'),reload());break}
    case 'svstatus':{const id=t.dataset.id,x=S.d.service_orders.find(s=>s.id===id);
      if(t.value==='iptal'&&S.ui.svArm!==id){S.ui.svArm=id;toast('İptal için durumu tekrar "İptal" seçin',true);t.value=x.status;break}
      S.ui.svArm=null;const r=await sb.from('service_orders').update({status:t.value}).eq('id',id);r.error?(toast(r.error.message,true),render()):(toast('Durum güncellendi'),reload());break}
    case 'ordstatus':{const r=await sb.from('customer_orders').update({status:t.value}).eq('id',t.dataset.id);r.error?(toast(r.error.message,true),render()):(toast('Durum güncellendi'),reload());break}
    case 'qstatus':{const r=await sb.from('quotes').update({status:t.value}).eq('id',t.dataset.id);r.error?(toast(r.error.message,true),render()):(toast('Durum güncellendi'),reload());break}
    case 'qpick':{const p=S.d.productMap.get(t.value);if(p){S.qd.items=S.qd.items.filter(i=>i.desc.trim()||i.pid);S.qd.items.push({desc:p.model+(p.imei?' (IMEI '+p.imei+')':''),qty:1,price:p.target_price==null?0:Number(p.target_price),disc:0,pid:p.id});qRender()}t.value='';break}
    case 'qf':{const it=S.qd.items[i];if(!it)break;it[t.dataset.f]=t.dataset.f==='desc'?t.value:(Number(t.value)||0);qTotal();break}
    case 'taskstatus':{const r=await sb.from('tasks').update({status:t.value}).eq('id',t.dataset.id);r.error?(toast(r.error.message,true),render()):(toast('Görev güncellendi'),S.work=undefined,reload());break}
    case 'pkind':{const reg=await swReg(),sub=reg&&await reg.pushManager.getSubscription();if(!sub)break;
      const ks=[...document.querySelectorAll('[data-c="pkind"]')].filter(x=>x.checked).map(x=>x.dataset.k);
      const r=await sb.rpc('set_push_kinds',{p_endpoint:sub.endpoint,p_kinds:ks.length===PKINDS.length?null:ks});
      r.error?toast(r.error.message,true):toast('Kaydedildi');break}
    case 'perm':{const r=await sb.from('role_permissions').update({allowed:t.checked}).eq('role',t.dataset.r).eq('permission',t.dataset.p);r.error?toast(r.error.message,true):(toast('Yetki güncellendi'),reload());break}
  }});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.ui.q=t.value;stokList()}
  if(t.dataset.c==='cartprice'){S.cart.items[+t.dataset.i].price=Number(t.value)||0;refreshSums()}
  if(t.dataset.c==='cartdisc'){S.cart.items[+t.dataset.i].discount=Number(t.value)||0;refreshSums()}
  if(t.dataset.c==='payamount'){S.cart.pays[+t.dataset.i].amount=Number(t.value)||0;refreshSums()}
  if(t.dataset.c==='cartsearch'){S.cart.q=t.value;const pos=t.selectionStart;render();const n=document.getElementById('cq');if(n){n.focus();n.setSelectionRange(pos,pos)}}
  if(t.dataset.c==='qf'){const it=S.qd.items[+t.dataset.i];if(it){it[t.dataset.f]=t.dataset.f==='desc'?t.value:(Number(t.value)||0);qTotal()}}
  if(t.id==='svq'){S.ui.svq=t.value;const pos=t.selectionStart;render();const n=document.getElementById('svq');if(n){n.focus();n.setSelectionRange(pos,pos)}}
  if(t.dataset.c==='costin'){const p=document.getElementById('p-paid');if(p&&!p.dataset.touched)p.value=t.value}
  if(t.id==='p-paid')t.dataset.touched='1';
  if(t.id==='s-cust-nn')S.cart.nn=t.value;if(t.id==='s-cust-nt')S.cart.nt=t.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){scanStop();closeModal()}
  // USB / Bluetooth barkod okuyucu klavye gibi yazıp Enter basar
  if(e.key==='Enter'&&e.target.id==='cq'){const v=e.target.value.trim().toUpperCase();const p=v&&S.d.products.find(x=>x.status==='stokta'&&x.imei&&x.imei.toUpperCase()===v);if(p){e.preventDefault();S.cart.q='';cartAdd(p.id)}}});
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.d){S.d=null;renderLogin()}});
boot();
</script>
</body>
